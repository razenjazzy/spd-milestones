# kind multi-node cluster configuration for SPD Milestones
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: spd-cluster

# Multi-node configuration: 1 control plane + 2 worker nodes
nodes:
  # Control plane node
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # Expose ports for ingress controller
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
      # MongoDB port
      - containerPort: 27017
        hostPort: 27017
        protocol: TCP
      # Backend API port
      - containerPort: 30400
        hostPort: 4000
        protocol: TCP
      # GraphQL port
      - containerPort: 30401
        hostPort: 4001
        protocol: TCP
      # Frontend port
      - containerPort: 30300
        hostPort: 3000
        protocol: TCP

  # Worker node 1
  - role: worker
    labels:
      node-type: application
      tier: backend

  # Worker node 2
  - role: worker
    labels:
      node-type: application
      tier: frontend

# Networking configuration
networking:
  apiServerAddress: "127.0.0.1"
  apiServerPort: 6443
  podSubnet: "10.244.0.0/16"
  serviceSubnet: "10.96.0.0/12"
