apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: spd-milestones
  labels:
    app: backend
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        tier: api
    spec:
      containers:
      - name: backend
        image: spd-milestones-backend:latest
        imagePullPolicy: Never  # Use local image built by Docker
        ports:
        - containerPort: 4000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: MONGO_URI
          value: "mongodb://mongodb:27017/spd"
        - name: PORT
          value: "4000"
        - name: DISABLE_GRAPHQL
          value: "true"
        - name: LOG_TO_FILE
          value: "false"
        - name: LOG_LEVEL
          value: "debug"
        - name: TZ
          value: "Asia/Dhaka"
        - name: REQUEST_TIMEOUT
          value: "25000"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        startupProbe:
          httpGet:
            path: /health
            port: 4000
          initialDelaySeconds: 0
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 15
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: spd-milestones
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
  - port: 4000
    targetPort: 4000
    protocol: TCP
    name: http
  selector:
    app: backend
