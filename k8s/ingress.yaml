apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spd-ingress
  namespace: spd-milestones
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/websocket-services: frontend
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
  - host: spd.milestones
    http:
      paths:
      # Backend API routes
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 4000
      # GraphQL routes
      - path: /graphql
        pathType: Prefix
        backend:
          service:
            name: graphql
            port:
              number: 4001
      # Health check endpoints
      - path: /health
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              number: 4000
      # Frontend (default route)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              number: 3000
