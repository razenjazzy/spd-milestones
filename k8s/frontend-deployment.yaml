apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: spd-milestones
  labels:
    app: frontend
    tier: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: frontend
    spec:
      containers:
      - name: frontend
        image: spd-milestones-frontend:latest
        imagePullPolicy: Never  # Use local image built by Docker
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: VITE_API_BASE
          value: "/api"
        - name: VITE_GRAPHQL_URI
          value: "/graphql"
        - name: NODE_ENV
          value: "development"
        - name: VITE_API_TIMEOUT
          value: "30000"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 3
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        startupProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 0
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 15
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: spd-milestones
  labels:
    app: frontend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: frontend
