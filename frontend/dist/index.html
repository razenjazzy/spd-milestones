          // IDM class patterns
          const idmSelectors = [
            '[class*="idm"]',
            '[id*="idm"]',
            '[class*="dmldm"]',
            '[id*="dmldm"]',
            'div[style*="z-index: 2147483647"]', // IDM's common z-index

          });

                  }
                }
              }
            });

          childList: true,
          subtree: true
