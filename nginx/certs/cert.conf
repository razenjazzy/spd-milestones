[req]
default_bits = 2048
prompt = no
default_md = sha256
distinguished_name = dn
req_extensions = v3_req

[dn]
C = US
ST = State
L = City
O = SPD
OU = IT
CN = spd.milestones

[v3_req]
subjectAltName = @alt_names

[alt_names]
DNS.1 = spd.milestones
DNS.2 = localhost
DNS.3 = *.spd.milestones
IP.1 = 127.0.0.1
IP.2 = ::1
